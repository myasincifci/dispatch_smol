defaults:
  - base

name: DR
logging: True
unlabeled: False

data:
    name: dr
    num_workers: 4
    color_aug: false
    num_classes: 5

model:
    pretrained: False
    projector_dim: 8_192

param:
    lr: 3e-4
    batch_size: 256

disc:
    alpha: 0.0
    mult: 0.0

mixstyle:
    active: true
    p: 1.0 
    alpha: 0.1
    eps: 1e-6

trainer:
    max_steps: 100_000
    cos_decay: True
    warmup: 10_000

logger:
    project: pretraining-dr  