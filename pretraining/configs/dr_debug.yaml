defaults:
  - base

name: DR
logging: true
unlabeled: false

seed: 42

data:
    name: dr
    num_workers: 4
    num_classes: 5
    color_aug: true
    color_aug_fct: 1.0

model:
    pretrained: true
    projector_dim: 8_192

param:
    lr: 3e-4
    batch_size: 400

disc:
    alpha: 0.0
    mult: 0.0

mixstyle:
    active: False
    p: 1.0 
    alpha: 0.1
    eps: 1e-6

trainer:
    max_steps: 100_000
    max_epochs: 1000
    cos_decay: True
    warmup_epochs: 10
    check_val_every_n_epoch: 10

logger:
    project: dr-sweeps